repos:
  - repo: local
    hooks:
      - id: staged-secret-guard
        name: staged private files and credentials
        entry: python3 scripts/check_staged_secrets.py --repo .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: staged-file-token-limit
        name: staged file token limit
        entry: python3 .pre-commit-token-limit/check_staged_tokens.py --repo .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
